<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KnowledgeJump 双栏对照</title>
  <link rel="stylesheet" href="/katex/katex-swap.min.css" />
  <script src="/preload.js"></script>
  <style>
    :root,
    :root[data-theme="light"] {
      color-scheme: light;
      --kj-bg: var(--background, #f8fafc);
      --kj-surface: var(--card, #ffffff);
      --kj-border: var(--card-border, var(--border, #cbd5e1));
      --kj-text: var(--foreground, #0f172a);
      --kj-muted: var(--muted-foreground, #475569);
      --kj-placeholder: var(--placeholder, var(--muted-foreground, #64748b));
      --kj-accent: var(--primary, #2563eb);
      --kj-accent-fg: var(--primary-foreground, #ffffff);
      --kj-accent-hover: color-mix(in srgb, var(--kj-accent) 88%, var(--kj-accent-fg));
      --kj-hover-bg: color-mix(in srgb, var(--kj-text) 7%, transparent);
      --kj-pill-bg: rgba(37, 99, 235, 0.12);
      --kj-pill-text: #1d4ed8;
      --kj-pill-green-bg: rgba(16, 185, 129, 0.14);
      --kj-pill-green-text: #047857;
      --kj-link: var(--link, #1d4ed8);
      --kj-heading: var(--link, #1e40af);
      --kj-quote-bg: color-mix(in srgb, var(--kj-accent) 8%, transparent);
      --kj-quote-border: color-mix(in srgb, var(--kj-accent) 42%, transparent);
      --kj-table-head-bg: color-mix(in srgb, var(--kj-accent) 10%, transparent);
      --kj-code-bg: color-mix(in srgb, var(--kj-text) 7%, transparent);
      --kj-code-fg: var(--code-foreground, inherit);
      --kj-warn-bg: #fffbeb;
      --kj-warn-border: #d97706;
      --kj-warn-text: #92400e;
      --kj-error-bg: #fef2f2;
      --kj-error-border: var(--error, #ef4444);
      --kj-error-text: var(--error, #b91c1c);
      --kj-hl-bg: rgba(250, 204, 21, 0.34);
      --kj-hl-border: #d97706;
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --kj-bg: var(--background, #181a1f);
      --kj-surface: var(--card, #21252b);
      --kj-border: var(--card-border, var(--border, #2e3440));
      --kj-text: var(--foreground, #e5e9f0);
      --kj-muted: var(--muted-foreground, #9aa5b1);
      --kj-placeholder: var(--placeholder, var(--muted-foreground, #8b95a5));
      --kj-accent: var(--primary, #3b82f6);
      --kj-accent-fg: var(--primary-foreground, #ffffff);
      --kj-accent-hover: color-mix(in srgb, var(--kj-accent) 86%, var(--kj-accent-fg));
      --kj-hover-bg: color-mix(in srgb, var(--kj-text) 9%, transparent);
      --kj-pill-bg: rgba(59, 130, 246, 0.22);
      --kj-pill-text: #93c5fd;
      --kj-pill-green-bg: rgba(16, 185, 129, 0.18);
      --kj-pill-green-text: #6ee7b7;
      --kj-link: var(--link, #93c5fd);
      --kj-heading: var(--link, #93c5fd);
      --kj-quote-bg: color-mix(in srgb, var(--kj-accent) 12%, transparent);
      --kj-quote-border: color-mix(in srgb, var(--kj-accent) 45%, transparent);
      --kj-table-head-bg: color-mix(in srgb, var(--kj-accent) 16%, transparent);
      --kj-code-bg: color-mix(in srgb, var(--kj-text) 12%, transparent);
      --kj-code-fg: var(--code-foreground, inherit);
      --kj-warn-bg: rgba(245, 158, 11, 0.14);
      --kj-warn-border: rgba(245, 158, 11, 0.5);
      --kj-warn-text: #fde68a;
      --kj-error-bg: rgba(239, 68, 68, 0.14);
      --kj-error-border: rgba(239, 68, 68, 0.55);
      --kj-error-text: #fca5a5;
      --kj-hl-bg: rgba(255, 215, 0, 0.28);
      --kj-hl-border: #f59e0b;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --kj-bg: var(--background, #181a1f);
        --kj-surface: var(--card, #21252b);
        --kj-border: var(--card-border, var(--border, #2e3440));
        --kj-text: var(--foreground, #e5e9f0);
        --kj-muted: var(--muted-foreground, #9aa5b1);
        --kj-placeholder: var(--placeholder, var(--muted-foreground, #8b95a5));
        --kj-accent: var(--primary, #3b82f6);
        --kj-accent-fg: var(--primary-foreground, #ffffff);
        --kj-accent-hover: color-mix(in srgb, var(--kj-accent) 86%, var(--kj-accent-fg));
        --kj-hover-bg: color-mix(in srgb, var(--kj-text) 9%, transparent);
        --kj-pill-bg: rgba(59, 130, 246, 0.22);
        --kj-pill-text: #93c5fd;
        --kj-pill-green-bg: rgba(16, 185, 129, 0.18);
        --kj-pill-green-text: #6ee7b7;
        --kj-link: var(--link, #93c5fd);
        --kj-heading: var(--link, #93c5fd);
        --kj-quote-bg: color-mix(in srgb, var(--kj-accent) 12%, transparent);
        --kj-quote-border: color-mix(in srgb, var(--kj-accent) 45%, transparent);
        --kj-table-head-bg: color-mix(in srgb, var(--kj-accent) 16%, transparent);
        --kj-code-bg: color-mix(in srgb, var(--kj-text) 12%, transparent);
        --kj-code-fg: var(--code-foreground, inherit);
        --kj-warn-bg: rgba(245, 158, 11, 0.14);
        --kj-warn-border: rgba(245, 158, 11, 0.5);
        --kj-warn-text: #fde68a;
        --kj-error-bg: rgba(239, 68, 68, 0.14);
        --kj-error-border: rgba(239, 68, 68, 0.55);
        --kj-error-text: #fca5a5;
        --kj-hl-bg: rgba(255, 215, 0, 0.28);
        --kj-hl-border: #f59e0b;
      }
    }
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0; height: 100%;
      background: var(--kj-bg); color: var(--kj-text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      font-size: 13px;
    }
    textarea::placeholder, input::placeholder { color: var(--kj-placeholder); opacity: 1; }
    .app { display: flex; flex-direction: column; height: 100vh; background: var(--kj-bg); color: var(--kj-text); }
    .topbar {
      display: flex; align-items: center; justify-content: space-between;
      padding: 8px 12px; border-bottom: 1px solid var(--kj-border);
      background: var(--kj-surface); color: var(--kj-text); gap: 8px; flex-wrap: nowrap; overflow: hidden;
    }
    .brand {
      display: flex; align-items: center; gap: 8px; font-weight: 600; font-size: 13.5px;
      color: var(--kj-text); min-width: 0; overflow: hidden; white-space: nowrap;
    }
    .pill {
      font-size: 11px; padding: 2px 8px; border-radius: 999px;
      background: var(--kj-pill-bg); color: var(--kj-pill-text); font-weight: 500;
      flex-shrink: 0; white-space: nowrap;
    }
    #indexPill { overflow: hidden; text-overflow: ellipsis; max-width: 45vw; }
    .pill.green { background: var(--kj-pill-green-bg); color: var(--kj-pill-green-text); }
    .btn-group { display: flex; gap: 6px; flex-shrink: 0; white-space: nowrap; }
    @media (max-width: 520px) {
      .brand .pill.green { display: none; }
    }
    button {
      cursor: pointer; border: 1px solid var(--kj-border);
      background: transparent; color: var(--kj-text);
      padding: 4px 10px; border-radius: 5px; font-size: 12px;
    }
    button:hover { background: var(--kj-hover-bg); }
    button.primary { background: var(--kj-accent); border-color: var(--kj-accent); color: var(--kj-accent-fg); font-weight: 500; }
    button.primary:hover { background: var(--kj-accent-hover); }
    button.danger { color: var(--kj-error-text); border-color: var(--kj-error-border); }
    button.danger:hover { background: var(--kj-error-bg); }
    button:disabled { opacity: 0.55; cursor: not-allowed; }

    .mode-row {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-top: 8px; flex-wrap: wrap;
      font-size: 11.5px; color: var(--kj-muted);
    }
    .mode-switch {
      display: inline-flex; border: 1px solid var(--kj-border); border-radius: 6px;
      overflow: hidden; background: var(--kj-bg);
    }
    .mode-switch button {
      border: none; border-radius: 0; padding: 3px 9px; font-size: 11.5px;
      color: var(--kj-muted); background: transparent;
    }
    .mode-switch button + button { border-left: 1px solid var(--kj-border); }
    .mode-switch button.active {
      background: var(--kj-accent); color: var(--kj-accent-fg); font-weight: 500;
    }

    .cards-toolbar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; margin-bottom: 8px; padding: 6px 10px;
      border: 1px solid var(--kj-border); border-radius: 7px;
      background: var(--kj-surface); font-size: 12px; color: var(--kj-muted);
    }
    .cards-toolbar .summary { font-weight: 500; color: var(--kj-text); }

    .problem-group-header {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; padding: 4px 8px; margin-top: 4px;
      border-left: 3px solid var(--kj-accent);
      background: var(--kj-quote-bg); border-radius: 0 5px 5px 0;
      font-size: 11.5px; color: var(--kj-muted);
    }
    .problem-group-header:first-child { margin-top: 0; }
    .problem-group-title { font-weight: 600; color: var(--kj-text); }
    .problem-group-meta { display: flex; align-items: center; gap: 6px; min-width: 0; }
    .problem-group-actions { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
    .problem-group-fav {
      padding: 1px 7px; font-size: 11px; border-color: transparent; color: var(--kj-muted);
    }
    .problem-group-fav:hover { color: #d97706; background: var(--kj-hover-bg); }
    .problem-group-fav.active { color: #d97706; font-weight: 600; }
    .problem-group-remove {
      padding: 1px 6px; font-size: 11px; border-color: transparent; color: var(--kj-muted);
    }
    .problem-group-remove:hover { color: var(--kj-error-text); background: var(--kj-error-bg); }

    .split {
      flex: 1; display: flex; flex-direction: row; min-height: 0; min-width: 0;
      --kj-split-pct: 50%;
      --kj-split-v-pct: 46%;
    }
    .split.stacked { flex-direction: column; }
    .pane {
      display: flex; flex-direction: column; min-height: 0; min-width: 0;
      overflow-y: auto; padding: 12px; contain: layout style;
    }
    .pane.left {
      flex: 0 0 calc(var(--kj-split-pct) - 5px);
      min-width: 80px;
    }
    .pane.right {
      flex: 1 1 0%;
      min-width: 80px;
    }
    .split.stacked .pane.left {
      flex: 0 0 calc(var(--kj-split-v-pct) - 5px);
      min-width: 0;
      min-height: 72px;
    }
    .split.stacked .pane.right {
      flex: 1 1 0%;
      min-width: 0;
      min-height: 72px;
    }
    .split-resizer {
      flex: 0 0 10px;
      position: relative;
      cursor: col-resize;
      touch-action: none;
      user-select: none;
      background: transparent;
      transition: background-color 0.15s ease;
    }
    .split-resizer::before {
      content: "";
      position: absolute;
      top: 0; bottom: 0; left: 50%;
      width: 1px;
      transform: translateX(-50%);
      background: var(--kj-border);
      transition: background-color 0.15s ease, width 0.15s ease;
    }
    .split-resizer::after {
      content: "";
      position: absolute;
      top: 50%; left: 50%;
      width: 4px; height: 40px;
      transform: translate(-50%, -50%);
      border-radius: 999px;
      background: var(--kj-muted);
      opacity: 0.55;
      transition: background-color 0.15s ease, opacity 0.15s ease;
    }
    .split-resizer:hover,
    .split-resizer.dragging {
      background: var(--kj-hover-bg);
    }
    .split-resizer:focus-visible {
      outline: 2px solid var(--kj-accent);
      outline-offset: -2px;
    }
    .split-resizer:hover::before,
    .split-resizer.dragging::before {
      width: 2px;
      background: var(--kj-accent);
    }
    .split-resizer:hover::after,
    .split-resizer.dragging::after {
      background: var(--kj-accent);
      opacity: 1;
    }
    .split.stacked .split-resizer {
      cursor: row-resize;
    }
    .split.stacked .split-resizer::before {
      left: 0; right: 0; top: 50%; bottom: auto;
      width: auto; height: 1px;
      transform: translateY(-50%);
    }
    .split.stacked .split-resizer:hover::before,
    .split.stacked .split-resizer.dragging::before {
      width: auto; height: 2px;
    }
    .split.stacked .split-resizer::after {
      width: 40px; height: 4px;
    }
    body.is-resizing, body.is-resizing * {
      transition: none !important;
    }
    body.is-window-resizing,
    body.is-window-resizing .app {
      overflow: hidden !important;
    }
    body.is-window-resizing #splitContainer {
      flex: none !important;
      width: var(--kj-frozen-w);
      height: var(--kj-frozen-h);
      overflow: hidden !important;
    }
    body.is-split-dragging {
      user-select: none !important;
      cursor: col-resize !important;
    }
    body.is-split-dragging.stacked-dragging {
      cursor: row-resize !important;
    }
    body.is-split-dragging .pane {
      pointer-events: none;
    }
    .split {
      position: relative;
    }
    .split-ghost-line {
      display: none;
      position: absolute;
      z-index: 20;
      pointer-events: none;
      background: var(--kj-accent);
      box-shadow: 0 0 0 1px rgba(0, 0, 0, 0.08);
    }
    .split-ghost-line.active {
      display: block;
    }
    .split:not(.stacked) .split-ghost-line {
      top: 0;
      bottom: 0;
      width: 2px;
      transform: translateX(-1px);
    }
    .split.stacked .split-ghost-line {
      left: 0;
      right: 0;
      height: 2px;
      transform: translateY(-1px);
    }

    .banner {
      padding: 8px 10px; border-radius: 6px;
      border: 1px solid var(--kj-warn-border); background: var(--kj-warn-bg); color: var(--kj-warn-text);
      margin-bottom: 10px; font-size: 12px;
      display: flex; justify-content: space-between; align-items: center; gap: 8px;
    }
    .banner.info {
      border-color: var(--kj-quote-border);
      background: var(--kj-quote-bg);
      color: var(--kj-text);
    }
    .banner.error {
      border-color: var(--kj-error-border);
      background: var(--kj-error-bg);
      color: var(--kj-error-text);
    }

    .input-box {
      border: 1px solid var(--kj-border); border-radius: 8px;
      padding: 10px; background: var(--kj-surface); margin-bottom: 12px;
    }
    .paste-hint { font-size: 11.5px; color: var(--kj-muted); margin-bottom: 6px; }
    textarea {
      width: 100%; min-height: 68px; resize: vertical;
      border: 1px solid var(--kj-border); border-radius: 5px;
      background: var(--kj-bg); color: var(--kj-text);
      padding: 7px 9px; font-family: inherit; font-size: 12.5px;
    }
    .actions { display: flex; justify-content: space-between; margin-top: 8px; }

    .cards { display: flex; flex-direction: column; gap: 10px; }
    .card {
      border: 1px solid var(--kj-border); border-radius: 8px;
      padding: 10px 12px; background: var(--kj-surface); color: var(--kj-text);
    }
    .card.clickable { cursor: pointer; }
    .card.clickable:hover { border-color: var(--kj-accent); }
    .card-top {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 6px; gap: 6px;
    }
    .seg-tag {
      font-size: 11px; font-weight: 600; padding: 2px 7px; border-radius: 4px;
      background: var(--kj-pill-bg); color: var(--kj-pill-text);
    }
    .card-body { line-height: 1.6; word-break: break-word; color: var(--kj-text); }
    .card-foot {
      margin-top: 8px; padding-top: 6px; border-top: 1px solid var(--kj-border);
      font-size: 11.5px; color: var(--kj-link); font-weight: 500;
    }
    .card-foot.muted { color: var(--kj-muted); font-weight: 400; }

    .doc-header {
      font-weight: 600; font-size: 12.5px; padding-bottom: 8px;
      margin-bottom: 10px; border-bottom: 1px solid var(--kj-border); color: var(--kj-muted);
    }
    .doc-line {
      padding: 3px 8px; border-radius: 4px; word-break: break-word;
      font-size: 13px; line-height: 1.7; transition: background-color 0.25s ease;
      color: var(--kj-text);
    }
    .doc-line h1, .doc-line h2, .doc-line h3, .doc-line h4 {
      margin: 8px 0 4px; color: var(--kj-heading); line-height: 1.35;
    }
    .doc-line h1 { font-size: 17px; border-bottom: 1px solid var(--kj-border); padding-bottom: 4px; }
    .doc-line h2 { font-size: 15px; }
    .doc-line h3 { font-size: 14px; }
    .doc-line h4 { font-size: 13px; }
    .doc-line blockquote {
      margin: 4px 0; padding: 4px 10px; border-left: 3px solid var(--kj-accent);
      background: var(--kj-quote-bg); color: var(--kj-muted); border-radius: 0 4px 4px 0;
    }
    .doc-line.list-item { padding-left: 18px; position: relative; }
    .doc-line.list-item::before {
      content: "•"; position: absolute; left: 6px; color: var(--kj-accent); font-weight: bold;
    }
    .doc-line code, .card-body code, .md-table code {
      background: var(--kj-code-bg); color: var(--kj-code-fg); padding: 1px 5px; border-radius: 3px;
      font-family: "JetBrains Mono", Consolas, monospace; font-size: 12px;
    }
    .doc-line .katex-display, .card-body .katex-display {
      overflow-x: auto; overflow-y: hidden; max-width: 100%;
      padding: 4px 2px; margin: 6px 0;
    }
    .doc-line.hl-amber, tr.hl-amber td, tr.hl-amber th {
      background-color: var(--kj-hl-bg);
    }
    .doc-line.hl-amber { border-left: 3px solid var(--kj-hl-border); }
    .md-table {
      width: 100%;
      border-collapse: collapse;
      margin: 8px 0;
      font-size: 12px;
      background: var(--kj-surface);
      color: var(--kj-text);
    }
    .md-table th, .md-table td {
      border: 1px solid var(--kj-border);
      padding: 6px 8px;
      text-align: left;
      vertical-align: top;
    }
    .md-table th {
      background: var(--kj-table-head-bg);
      font-weight: 600;
    }
    .pdf-page {
      padding: 10px 12px; border: 1px solid var(--kj-border); border-radius: 6px;
      margin-bottom: 10px; background: var(--kj-surface); color: var(--kj-text);
      transition: background-color 0.25s ease;
    }
    .pdf-page.hl-amber { background-color: var(--kj-hl-bg); border-color: var(--kj-hl-border); }
    .doc-window-bar {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap;
      margin: 6px 0 10px; padding: 6px 10px;
      border: 1px dashed var(--kj-border); border-radius: 6px;
      background: var(--kj-surface); color: var(--kj-muted); font-size: 11.5px;
    }
    .doc-window-bar .win-actions { display: flex; gap: 6px; flex-wrap: wrap; }
    .doc-window-bar button { padding: 2px 8px; font-size: 11.5px; }
    .empty { color: var(--kj-muted); text-align: center; padding: 26px 12px; font-size: 12px; }

    .modal-backdrop {
      display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.55);
      align-items: center; justify-content: center; z-index: 99;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      width: min(420px, 92vw); background: var(--kj-surface); color: var(--kj-text);
      border: 1px solid var(--kj-border); border-radius: 8px; padding: 16px;
    }
    .modal h3 { margin: 0 0 12px; font-size: 14px; color: var(--kj-text); }
    .field label { display: block; font-size: 12px; color: var(--kj-muted); margin-bottom: 4px; }
    .field input {
      width: 100%; padding: 6px 8px; border: 1px solid var(--kj-border);
      border-radius: 4px; background: var(--kj-bg); color: var(--kj-text); font-size: 12.5px;
    }
    .modal-foot { display: flex; justify-content: flex-end; gap: 8px; margin-top: 12px; }
    .modal.wide { width: min(560px, 94vw); max-height: 82vh; display: flex; flex-direction: column; }
    .modal-sub { font-size: 11.5px; color: var(--kj-muted); margin: -6px 0 10px; }
    .chat-list {
      overflow-y: auto; flex: 1; min-height: 120px; max-height: 54vh;
      display: flex; flex-direction: column; gap: 8px; padding-right: 2px;
    }
    .chat-item {
      border: 1px solid var(--kj-border); border-radius: 7px;
      padding: 8px 10px; background: var(--kj-bg); color: var(--kj-text);
      display: flex; flex-direction: column; gap: 6px;
    }
    .chat-item-top {
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; font-size: 11px; color: var(--kj-muted);
    }
    .chat-role {
      font-weight: 600; padding: 1px 6px; border-radius: 4px;
      background: var(--kj-pill-bg); color: var(--kj-pill-text);
    }
    .chat-role.ai { background: var(--kj-pill-green-bg); color: var(--kj-pill-green-text); }
    .chat-preview { font-size: 12px; line-height: 1.5; word-break: break-word; color: var(--kj-text); }
    .chat-item-actions { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
    .chat-item-actions button { padding: 2px 8px; font-size: 11.5px; }

    .chat-import-bar {
      padding: 8px 10px; border-radius: 8px;
      border: 1px solid var(--kj-quote-border);
      background: var(--kj-quote-bg); margin-bottom: 10px;
      display: flex; align-items: center; justify-content: space-between;
      gap: 8px; flex-wrap: wrap;

  <script>
    let lastHostBgValue = null;
    function syncHostTheme() {
      const root = document.documentElement;
      const rawBg = getComputedStyle(root).getPropertyValue('--background').trim();
      if (rawBg === lastHostBgValue && root.dataset.theme) return;
      lastHostBgValue = rawBg;
      let theme = '';
      if (rawBg) {
        const probe = document.createElement('span');
        probe.style.cssText = 'position:absolute;visibility:hidden;pointer-events:none;color:var(--background)';
        root.appendChild(probe);
        const c = getComputedStyle(probe).color;
        probe.remove();
        const nums = (c.match(/[\d.]+/g) || []).map(Number);
        if (nums.length >= 3) {
          const scale = c.startsWith('color(') ? 1 : 255;
          const [r, g, b] = nums.slice(0, 3).map((v) => v / scale);
          const lum = 0.2126 * r + 0.7152 * g + 0.0722 * b;
          theme = lum < 0.5 ? 'dark' : 'light';
        }
      }
      if (!theme && window.matchMedia) {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      if (theme && root.dataset.theme !== theme) {
        root.dataset.theme = theme;
      }
    }
    syncHostTheme();
    new MutationObserver(syncHostTheme).observe(document.documentElement, {
      attributes: true,
      attributeFilter: ['style'],
    });
    window.addEventListener('message', (event) => {
      if (event.data?.type === 'theme-change') {
        requestAnimationFrame(syncHostTheme);
      }
    });
    if (window.matchMedia) {
      const mq = window.matchMedia('(prefers-color-scheme: dark)');
      if (typeof mq.addEventListener === 'function') mq.addEventListener('change', syncHostTheme);
    }

    const DOC_WINDOW_THRESHOLD = 200;
    const DOC_WIN_BEFORE = 60;
    const DOC_WIN_AFTER = 100;
    const DOC_WIN_STEP = 120;
    const PDF_WINDOW_THRESHOLD = 15;
    const PDF_WIN_BEFORE = 4;
    const PDF_WIN_AFTER = 6;
    const PDF_WIN_STEP = 8;

    let lastCardsUpdatedAt = 0;
    let importMode = 'replace';
    let hlTimer = null;
    let loadedDocKey = null;
    let loadedDoc = null;
    let docWindow = { start: 0, end: -1, startPage: 0, endPage: -1 };
    let docBlocks = [];
    let pdfPageMap = new Map();
    let mathObserver = null;
    let mathQueue = [];
    let mathRaf = 0;
    let mathIdleHandle = 0;
    let splitRatioH = 0.5;
    let splitRatioV = 0.46;
    let layoutPreference = 'auto';
    let isStacked = false;
    let isResizing = false;
    let resizeEndTimer = null;
    let isPollingCards = false;
    let awaitingChatImport = false;
    let importStatusTimer = null;
    let currentSegments = [];
    let currentKnowledgeDir = '';
    let historyState = { limit: 3, items: [] };
    let favoritesState = { items: [] };
    let activeLibraryTab = 'history';
    const deferredMathContainers = new Set();

    const KATEX_OPTIONS = {
      delimiters: [
        { left: '$$', right: '$$', display: true },
        { left: '\\[', right: '\\]', display: true },
        { left: '$', right: '$', display: false },
        { left: '\\(', right: '\\)', display: false }
      ],
      throwOnError: false
    };

    const indexPill = document.getElementById('indexPill');
    const bannersEl = document.getElementById('banners');
    const importStatusEl = document.getElementById('importStatus');
    const importChatBtn = document.getElementById('importChatBtn');
    const pickChatBtn = document.getElementById('pickChatBtn');
    const chatPickerModal = document.getElementById('chatPickerModal');
    const chatPickerSub = document.getElementById('chatPickerSub');
    const chatPickerList = document.getElementById('chatPickerList');
    const refreshChatBtn = document.getElementById('refreshChatBtn');
    const closeChatPickerBtn = document.getElementById('closeChatPickerBtn');
    const actionErrorEl = document.getElementById('actionError');
    const questionText = document.getElementById('questionText');
    const analyzeBtn = document.getElementById('analyzeBtn');
    const clearBtn = document.getElementById('clearBtn');
    const modeReplaceBtn = document.getElementById('modeReplaceBtn');
    const modeAppendBtn = document.getElementById('modeAppendBtn');
    const cardsToolbar = document.getElementById('cardsToolbar');
    const cardsSummary = document.getElementById('cardsSummary');
    const clearCardsBtn = document.getElementById('clearCardsBtn');
    const rebuildBtn = document.getElementById('rebuildBtn');
    const settingsBtn = document.getElementById('settingsBtn');
    const historyBtn = document.getElementById('historyBtn');
    const favoritesBtn = document.getElementById('favoritesBtn');
    const historyCountBadge = document.getElementById('historyCountBadge');
    const favCountBadge = document.getElementById('favCountBadge');
    const layoutToggleBtn = document.getElementById('layoutToggleBtn');
    const resultsEl = document.getElementById('results');
    const splitContainer = document.getElementById('splitContainer');
    const leftPane = document.getElementById('leftPane');
    const splitResizer = document.getElementById('splitResizer');
    const docPane = document.getElementById('docPane');
    const docHeader = document.getElementById('docHeader');
    const docContent = document.getElementById('docContent');
    const settingsModal = document.getElementById('settingsModal');
    const cfgKbDir = document.getElementById('cfgKbDir');
    const cfgHistoryLimit = document.getElementById('cfgHistoryLimit');
    const libraryModal = document.getElementById('libraryModal');
    const libTabHistory = document.getElementById('libTabHistory');
    const libTabFavorites = document.getElementById('libTabFavorites');
    const libLimitControl = document.getElementById('libLimitControl');
    const libHistoryLimitInput = document.getElementById('libHistoryLimitInput');
    const libSaveLimitBtn = document.getElementById('libSaveLimitBtn');
    const librarySub = document.getElementById('librarySub');
    const libraryList = document.getElementById('libraryList');
    const clearHistoryBtn = document.getElementById('clearHistoryBtn');
    const closeLibraryBtn = document.getElementById('closeLibraryBtn');

    function clampRatio(val, fallback) {
      const n = Number(val);
      if (!Number.isFinite(n)) return fallback;
      return Math.min(0.92, Math.max(0.08, Math.round(n * 1000) / 1000));
    }

    function readSplitStorage() {
      try {
        const h = localStorage.getItem('kj_split_h');
        const v = localStorage.getItem('kj_split_v');
        const lp = localStorage.getItem('kj_layout_pref');
        if (h !== null) splitRatioH = clampRatio(h, 0.5);
        if (v !== null) splitRatioV = clampRatio(v, 0.46);
        if (lp === 'auto' || lp === 'horizontal' || lp === 'vertical') layoutPreference = lp;
      } catch {}
    }

    function writeSplitStorage() {
      try {
        localStorage.setItem('kj_split_h', String(splitRatioH));
        localStorage.setItem('kj_split_v', String(splitRatioV));
        localStorage.setItem('kj_layout_pref', layoutPreference);
      } catch {}
    }

    function applySplitRatio() {
      const hPct = (splitRatioH * 100).toFixed(3) + '%';
      const vPct = (splitRatioV * 100).toFixed(3) + '%';
      splitContainer.style.setProperty('--kj-split-pct', hPct);
      splitContainer.style.setProperty('--kj-split-v-pct', vPct);
      if (leftPane) {
        leftPane.style.flexBasis = isStacked ? `calc(${vPct} - 5px)` : `calc(${hPct} - 5px)`;
      }
    }

    function updateLayoutOrientation(initial = false) {
      const w = splitContainer.clientWidth || window.innerWidth;
      let next = isStacked;
      if (layoutPreference === 'vertical') {
        next = true;
      } else if (layoutPreference === 'horizontal') {
        next = false;
      } else if (initial) {
        next = w < 720;
      } else if (!isStacked && w < 680) {
        next = true;
      } else if (isStacked && w > 760) {
        next = false;
      }
      isStacked = next;
      splitContainer.classList.toggle('stacked', isStacked);
      splitResizer.setAttribute('aria-orientation', isStacked ? 'horizontal' : 'vertical');
      if (layoutToggleBtn) {
        layoutToggleBtn.textContent = isStacked ? '切换左右' : '切换上下';
      }
      applySplitRatio();
    }

    readSplitStorage();
    updateLayoutOrientation(true);

    if (layoutToggleBtn) {
      layoutToggleBtn.addEventListener('click', () => {
        layoutPreference = isStacked ? 'horizontal' : 'vertical';
        writeSplitStorage();
        updateLayoutOrientation(false);
      });
    }

    const splitGhostLine = document.getElementById('splitGhostLine');
    let dragActive = false;
    let dragPointerId = null;
    let dragRaf = 0;
    let dragClientX = 0;
    let dragClientY = 0;
    let pendingSplitRatioH = splitRatioH;
    let pendingSplitRatioV = splitRatioV;
    let isWindowResizing = false;
    let frozenSplitW = 0;
    let frozenSplitH = 0;
    let savedLeftScrollTop = 0;
    let savedDocScrollTop = 0;

    function captureFrozenSplitSize() {
      if (!splitContainer || isWindowResizing) return;
      const w = splitContainer.offsetWidth;
      const h = splitContainer.offsetHeight;
      if (w > 0 && h > 0) {
        frozenSplitW = w;
        frozenSplitH = h;
      }
    }

    captureFrozenSplitSize();
    window.addEventListener('load', captureFrozenSplitSize);

    function updateGhostLinePosition(ratio) {
      if (!splitGhostLine) return;
      const pct = (ratio * 100).toFixed(3) + '%';
      if (isStacked) {
        splitGhostLine.style.left = '';
        splitGhostLine.style.top = pct;
      } else {
        splitGhostLine.style.top = '';
        splitGhostLine.style.left = pct;
      }
    }

    function updateSplitFromPointer() {
      dragRaf = 0;
      const rect = splitContainer.getBoundingClientRect();
      if (isStacked) {
        const total = rect.height;
        if (total <= 0) return;
        const minPx = Math.min(72, total * 0.15);
        const pos = Math.min(total - minPx, Math.max(minPx, dragClientY - rect.top));
        pendingSplitRatioV = clampRatio(pos / total, 0.46);
        updateGhostLinePosition(pendingSplitRatioV);
      } else {
        const total = rect.width;
        if (total <= 0) return;
        const minPx = Math.min(80, total * 0.15);
        const pos = Math.min(total - minPx, Math.max(minPx, dragClientX - rect.left));
        pendingSplitRatioH = clampRatio(pos / total, 0.5);
        updateGhostLinePosition(pendingSplitRatioH);
      }
    }

    function finishSplitDrag() {
      if (!dragActive) return;
      dragActive = false;
      const pid = dragPointerId;
      dragPointerId = null;
      if (dragRaf) {
        cancelAnimationFrame(dragRaf);
        dragRaf = 0;
      }
      try {
        if (pid !== null && splitResizer.hasPointerCapture(pid)) splitResizer.releasePointerCapture(pid);
      } catch {}
      if (splitGhostLine) splitGhostLine.classList.remove('active');
      splitResizer.classList.remove('dragging');
      document.body.classList.remove('is-split-dragging', 'stacked-dragging');
      if (!isWindowResizing) {
        document.body.classList.remove('is-resizing');
        isResizing = false;
      }
      splitRatioH = pendingSplitRatioH;
      splitRatioV = pendingSplitRatioV;
      applySplitRatio();
      scheduleMathFlush();
      writeSplitStorage();
      apiCall('/api/settings', { splitRatio: splitRatioH, splitRatioV: splitRatioV }).catch(() => {});
    }

    splitResizer.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      e.preventDefault();
      dragActive = true;
      dragPointerId = e.pointerId;
      dragClientX = e.clientX;
      dragClientY = e.clientY;
      pendingSplitRatioH = splitRatioH;
      pendingSplitRatioV = splitRatioV;
      try { splitResizer.setPointerCapture(e.pointerId); } catch {}
      isResizing = true;
      cancelScheduledMath();
      splitResizer.classList.add('dragging');
      document.body.classList.add('is-resizing', 'is-split-dragging');
      if (isStacked) document.body.classList.add('stacked-dragging');
      if (splitGhostLine) splitGhostLine.classList.add('active');
      updateSplitFromPointer();
    });

    window.addEventListener('pointermove', (e) => {
      if (!dragActive) return;
      if (dragPointerId !== null && e.pointerId !== dragPointerId) return;
      dragClientX = e.clientX;
      dragClientY = e.clientY;
      if (!dragRaf) dragRaf = requestAnimationFrame(updateSplitFromPointer);
    });

    window.addEventListener('pointerup', (e) => {
      if (!dragActive) return;
      if (dragPointerId !== null && e.pointerId !== dragPointerId) return;
      finishSplitDrag();
    });

    window.addEventListener('pointercancel', (e) => {
      if (!dragActive) return;
      if (dragPointerId !== null && e.pointerId !== dragPointerId) return;
      finishSplitDrag();
    });

    window.addEventListener('blur', () => {
      if (dragActive) finishSplitDrag();
    });

    splitResizer.addEventListener('dblclick', () => {
      if (isStacked) splitRatioV = 0.46;
      else splitRatioH = 0.5;
      applySplitRatio();
      writeSplitStorage();
      apiCall('/api/settings', { splitRatio: splitRatioH, splitRatioV: splitRatioV }).catch(() => {});
    });

    splitResizer.addEventListener('keydown', (e) => {
      let handled = true;
      if (!isStacked && (e.key === 'ArrowLeft' || e.key === 'ArrowRight')) {
        splitRatioH = clampRatio(splitRatioH + (e.key === 'ArrowLeft' ? -0.05 : 0.05), 0.5);
      } else if (isStacked && (e.key === 'ArrowUp' || e.key === 'ArrowDown')) {
        splitRatioV = clampRatio(splitRatioV + (e.key === 'ArrowUp' ? -0.05 : 0.05), 0.46);
      } else if (e.key === 'Enter' || e.key === ' ') {
        if (isStacked) splitRatioV = 0.46;
        else splitRatioH = 0.5;
      } else {
        handled = false;
      }
      if (!handled) return;
      e.preventDefault();
      applySplitRatio();
      writeSplitStorage();
      apiCall('/api/settings', { splitRatio: splitRatioH, splitRatioV: splitRatioV }).catch(() => {});
    });

    window.addEventListener('resize', () => {
      if (!isWindowResizing) {
        isWindowResizing = true;
        if (leftPane) savedLeftScrollTop = leftPane.scrollTop;
        if (docPane) savedDocScrollTop = docPane.scrollTop;
        const w = frozenSplitW > 0 ? frozenSplitW : splitContainer.offsetWidth;
        const h = frozenSplitH > 0 ? frozenSplitH : splitContainer.offsetHeight;
        if (w > 0 && h > 0) {
          splitContainer.style.setProperty('--kj-frozen-w', `${w}px`);
          splitContainer.style.setProperty('--kj-frozen-h', `${h}px`);
        }
        document.body.classList.add('is-resizing', 'is-window-resizing');
      }
      isResizing = true;
      cancelScheduledMath();
      if (resizeEndTimer) clearTimeout(resizeEndTimer);
      resizeEndTimer = setTimeout(() => {
        resizeEndTimer = null;
        isWindowResizing = false;
        document.body.classList.remove('is-window-resizing');
        splitContainer.style.removeProperty('--kj-frozen-w');
        splitContainer.style.removeProperty('--kj-frozen-h');
        if (!dragActive) {
          isResizing = false;
          document.body.classList.remove('is-resizing');
        }
        updateLayoutOrientation(false);
        captureFrozenSplitSize();
        if (leftPane) leftPane.scrollTop = savedLeftScrollTop;
        if (docPane) docPane.scrollTop = savedDocScrollTop;
        scheduleMathFlush();
      }, 180);
    });

    function hasMathSyntax(s) {
      return typeof s === 'string' && (s.includes('$') || s.includes('\\(') || s.includes('\\['));
    }

    function renderMathNow(el) {
      if (!el || !el.isConnected) return;
      if (typeof renderMathInElement !== 'function') {
        deferredMathContainers.add(el);
        return;
      }
      if (el.dataset && el.dataset.mathPending === '1') {
        delete el.dataset.mathPending;
      }
      renderMathInElement(el, KATEX_OPTIONS);
    }

    function cancelScheduledMath() {
      if (mathRaf) {
        cancelAnimationFrame(mathRaf);
        mathRaf = 0;
      }
      if (mathIdleHandle && typeof cancelIdleCallback === 'function') {
        cancelIdleCallback(mathIdleHandle);
        mathIdleHandle = 0;
      }
    }

    function scheduleMathFlush() {
      if (isResizing || mathQueue.length === 0 || mathRaf || mathIdleHandle) return;
      if (typeof requestIdleCallback === 'function') {
        mathIdleHandle = requestIdleCallback(flushMathQueue, { timeout: 120 });
      } else {
        mathRaf = requestAnimationFrame(flushMathQueue);
      }
    }

    function flushMathQueue(deadline) {
      mathRaf = 0;
      mathIdleHandle = 0;
      if (isResizing) return;
      if (typeof renderMathInElement !== 'function') {
        for (const el of mathQueue) deferredMathContainers.add(el);
        mathQueue = [];
        return;
      }
      const start = performance.now();
      let processed = 0;
      while (mathQueue.length > 0 && performance.now() - start < 4) {
        if (deadline && typeof deadline.timeRemaining === 'function' && deadline.timeRemaining() <= 0.5 && processed > 0) {
          break;
        }
        const el = mathQueue.shift();
        if (el && el.isConnected && el.dataset.mathPending === '1') {
          delete el.dataset.mathPending;
          renderMathInElement(el, KATEX_OPTIONS);
          processed += 1;
        }
      }
      if (mathQueue.length > 0) {
        scheduleMathFlush();
      }
    }

    function enqueueLazyMath(el) {
      if (!el || el.dataset.mathPending !== '1') return;
      mathQueue.push(el);
      scheduleMathFlush();
    }

    function resetMathObserver() {
      if (mathObserver) {
        mathObserver.disconnect();
        mathObserver = null;
      }
      mathQueue = [];
      cancelScheduledMath();
    }

    function flushDeferredMath() {
      if (typeof renderMathInElement !== 'function' || deferredMathContainers.size === 0) return;
      for (const el of deferredMathContainers) renderMathNow(el);
      deferredMathContainers.clear();
    }
    window.addEventListener('DOMContentLoaded', flushDeferredMath);
    window.addEventListener('load', flushDeferredMath);

    function escapeHtml(s) {
      return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
    }

    function formatInlineMd(text) {
      // Protect LaTeX ($$...$$, $...$, \[...\], \(...\)) from Markdown * / _ formatting
      const mathSlots = [];
      const protectedText = String(text).replace(/\$\$[\s\S]+?\$\$|\\\[[\s\S]+?\\\]|\\\([\s\S]+?\\\)|\$[^$\n]+?\$/g, (m) => {
        const idx = mathSlots.length;
        mathSlots.push(escapeHtml(m));
        return `@@MATH_${idx}@@`;
      });

      let html = escapeHtml(protectedText)
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/\*([^*\n]+?)\*/g, '<em>$1</em>')
        .replace(/`([^`]+)`/g, '<code>$1</code>');

      html = html.replace(/@@MATH_(\d+)@@/g, (_, i) => mathSlots[Number(i)]);
      return html;
    }

    function renderSimpleMd(md) {
      return formatInlineMd(md).replace(/\n/g, '<br/>');
    }

    async function apiCall(path, body, method = 'POST') {
      const token = window.__SIDECAR_TOKEN__ || new URLSearchParams(location.search).get('token') || '';
      const headers = { 'Content-Type': 'application/json' };
      if (token) headers['x-sidecar-token'] = token;
      const res = await fetch(path, {
        method,
        headers,
        body: method === 'GET' ? undefined : JSON.stringify(body || {}),
      });
      const json = await res.json();
      if (!res.ok || json.error) throw new Error(json.error || ('HTTP ' + res.status));
      return json;
    }

    function showActionError(msg) {
      actionErrorEl.innerHTML = msg ? '<div class="banner error">' + escapeHtml(msg) + '</div>' : '';
    }

    function showImportStatus(msg, kind = 'info', autoHideMs = 0) {
      if (importStatusTimer) {
        clearTimeout(importStatusTimer);
        importStatusTimer = null;
      }
      if (!msg) {
        importStatusEl.innerHTML = '';
        return;
      }
      const cls = kind === 'error' ? 'banner error' : 'banner info';
      importStatusEl.innerHTML = '<div class="' + cls + '"><span>' + escapeHtml(msg) + '</span></div>';
      if (autoHideMs > 0) {
        importStatusTimer = setTimeout(() => {
          importStatusEl.innerHTML = '';
          importStatusTimer = null;
        }, autoHideMs);
      }
    }

    function getCurrentConversationId() {
      return (
        (window.sidecar && window.sidecar.conversationId) ||
        new URLSearchParams(location.search).get('conversationId') ||
        ''
      );
    }

    function buildImportInstruction(targetItem = null) {
      const modeDesc = importMode === 'append' ? '接在旧题后面（mode="append"）' : '清空旧题并覆盖（mode="replace"）';
      if (targetItem) {
        const ref = targetItem.stepIndex
          ? ('第 ' + targetItem.stepIndex + ' 步（' + targetItem.roleLabel + '发送' + (targetItem.mediaCount > 0 ? '，含 ' + targetItem.mediaCount + ' 张图片' : '') + '）')
          : '选中消息';
        const snippet = targetItem.preview ? ('，内容摘要：「' + targetItem.preview.slice(0, 80) + '」') : '';
        return (
          '[KnowledgeJump 导入指令] 请提取当前对话中 ' + ref + snippet +
          ' 所涉及的题目（若含图片请多模态识别公式与题干，公式用 LaTeX `$ ... $` / `$$ ... $$` 表示），' +
          '按逻辑拆分为语义片段后调用 kj_search 匹配本地知识库，最后调用 kj_push_cards(mode="' + importMode + '") ' +
          '以「' + modeDesc + '」的方式推送到 KnowledgeJump 面板。'
        );
      }
      return (
        '[KnowledgeJump 导入指令] 请识别并提取当前对话中最新出现的题目（含用户粘贴的题目截图或题干文字，公式用 LaTeX `$ ... $` / `$$ ... $$` 表示），' +
        '按逻辑拆分为语义片段（已知条件、各小问、核心考点）后调用 kj_search 匹配本地知识库，' +
        '最后调用 kj_push_cards(mode="' + importMode + '") 以「' + modeDesc + '」的方式推送到 KnowledgeJump 面板。'
      );
    }

    async function triggerChatImport(targetItem = null) {
      showActionError('');
      if (!window.sidecar || !window.sidecar.agent || typeof window.sidecar.agent.sendMessage !== 'function') {
        showImportStatus('当前页面未连接 Antigravity 宿主，请点「选择消息」直接离线导入文本。', 'error');
        return;
      }

      let convId = getCurrentConversationId();
      if (!convId) {
        try {
          const meta = await apiCall('/api/conversation-messages', null, 'GET');
          convId = meta?.conversationId || '';
        } catch {}
      }
      if (!convId) {
        showImportStatus('未检测到当前对话 ID，请在 Antigravity 会话右侧打开本面板。', 'error');
        return;
      }

      importChatBtn.disabled = true;
      const prevText = importChatBtn.textContent;
      importChatBtn.textContent = '发送指令中...';
      try {
        await window.sidecar.agent.sendMessage(buildImportInstruction(targetItem), convId);
        awaitingChatImport = true;
        const modeLabel = importMode === 'append' ? '接在旧题后' : '清空旧题';
        showImportStatus('⏳ 已向当前对话发送导入指令（' + modeLabel + '），正在等待 Antigravity 识题并推送卡片…', 'info');
        chatPickerModal.classList.remove('open');
      } catch (e) {
        showImportStatus('发送导入指令失败：' + e.message, 'error');
      } finally {
        importChatBtn.disabled = false;
        importChatBtn.textContent = prevText;
      }
    }

    async function loadConversationMessages() {
      chatPickerSub.textContent = '正在读取当前对话消息...';
      chatPickerList.innerHTML = '<div class="empty">加载中...</div>';
      try {
        const cid = getCurrentConversationId();
        const url = cid ? ('/api/conversation-messages?conversationId=' + encodeURIComponent(cid)) : '/api/conversation-messages';
        const data = await apiCall(url, null, 'GET');
        const label = data.title ? (data.title + ' (' + (data.conversationId || '').slice(0, 8) + ')') : ((data.conversationId || '未识别对话').slice(0, 8));
        chatPickerSub.textContent = '当前对话：' + label + '（共 ' + (data.messages?.length || 0) + ' 条近期消息）';

        if (!data.messages || !data.messages.length) {
          chatPickerList.innerHTML = '<div class="empty">当前对话暂无可读取的历史消息，可直接点击「导入对话中的题目」或粘贴文字。</div>';
          return;
        }

        chatPickerList.innerHTML = '';
        for (const item of data.messages) {
          const row = document.createElement('div');
          row.className = 'chat-item';

          const top = document.createElement('div');
          top.className = 'chat-item-top';
          const roleClass = item.role === 'assistant' ? 'chat-role ai' : 'chat-role';
          const mediaBadge = item.mediaCount > 0 ? (' · 📷 含 ' + item.mediaCount + ' 张图片') : '';
          const timeStr = item.createdAt ? new Date(item.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
          top.innerHTML =
            '<span><span class="' + roleClass + '">' + escapeHtml(item.roleLabel) + '</span>' + escapeHtml(mediaBadge) + '</span>' +
            '<span>' + escapeHtml(timeStr) + '</span>';

          const prev = document.createElement('div');
          prev.className = 'chat-preview';
          prev.textContent = item.preview;

          const acts = document.createElement('div');
          acts.className = 'chat-item-actions';

          const aiBtn = document.createElement('button');
          aiBtn.className = 'primary';
          aiBtn.textContent = item.mediaCount > 0 ? 'AI 识图并导入' : 'AI 识题导入';
          aiBtn.onclick = () => triggerChatImport(item);
          acts.appendChild(aiBtn);

          if (item.fullText) {
            const directBtn = document.createElement('button');
            directBtn.textContent = importMode === 'append' ? '直接追加导入' : '直接覆盖导入';
            directBtn.onclick = async () => {
              directBtn.disabled = true;
              try {
                const res = await apiCall('/api/analyze', { text: item.fullText, mode: importMode });
                lastCardsUpdatedAt = res.updatedAt || Date.now();
                renderSegments(res.segments, {
                  scrollToGroupId: res.mode === 'append' ? res.lastAddedGroupId : '',
                });
                refreshLibrary();
                chatPickerModal.classList.remove('open');
                showImportStatus('✅ 已离线导入选中消息中的题目！', 'info', 3500);
              } catch (e) {
                showActionError(e.message);
              } finally {
                directBtn.disabled = false;
              }
            };
            acts.appendChild(directBtn);

            const fillBtn = document.createElement('button');
            fillBtn.textContent = '填入输入框';
            fillBtn.onclick = () => {
              questionText.value = item.fullText;
              chatPickerModal.classList.remove('open');
              questionText.focus();
            };
            acts.appendChild(fillBtn);
          }

          row.appendChild(top);
          row.appendChild(prev);
          row.appendChild(acts);
          chatPickerList.appendChild(row);
        }
      } catch (e) {
        chatPickerSub.textContent = '读取失败';
        chatPickerList.innerHTML = '<div class="banner error">' + escapeHtml(e.message) + '</div>';
      }
    }

    function updateImportModeUI(mode) {
      importMode = mode === 'append' ? 'append' : 'replace';
      modeReplaceBtn.classList.toggle('active', importMode === 'replace');
      modeAppendBtn.classList.toggle('active', importMode === 'append');
      analyzeBtn.textContent = importMode === 'append' ? '本地拆解（接在旧题后）' : '本地拆解（清空旧题）';
      importChatBtn.textContent = importMode === 'append' ? '导入对话题目（追加）' : '导入对话题目（覆盖）';
    }

    async function setImportMode(mode) {
      const next = mode === 'append' ? 'append' : 'replace';
      updateImportModeUI(next);
      showActionError('');
      try {
        await apiCall('/api/settings', { importMode: next });
      } catch (e) {
        showActionError('保存导入方式失败：' + e.message);
      }
    }

    function updateStatusUI(state) {
      const st = state.indexStatus;
      currentKnowledgeDir = state.settings.knowledgeDir || '';
      cfgKbDir.value = currentKnowledgeDir;
      const limitVal = state.settings.historyLimit ?? 3;
      cfgHistoryLimit.value = String(limitVal);
      libHistoryLimitInput.value = String(limitVal);
      updateImportModeUI(state.settings.importMode || 'replace');
      if (state.history) historyState = state.history;
      if (state.favorites) favoritesState = state.favorites;
      updateLibraryBadges();
      if (state.settings.splitRatio != null || state.settings.splitRatioV != null) {
        if (state.settings.splitRatio != null) splitRatioH = clampRatio(state.settings.splitRatio, splitRatioH);
        if (state.settings.splitRatioV != null) splitRatioV = clampRatio(state.settings.splitRatioV, splitRatioV);
        applySplitRatio();
        writeSplitStorage();
      }
      indexPill.textContent = st.indexExists
        ? ('索引: ' + st.chunkCount + ' 切片 / ' + st.fileCount + ' 文件' + (st.embedding?.enabled ? ' · BGE+BM25' : ''))
        : '未建索引';

      bannersEl.innerHTML = '';
      if (!st.knowledgeDirExists) {
        addBanner('知识库目录不存在：' + st.knowledgeDirPath, '设置目录', () => settingsModal.classList.add('open'));
      } else if (st.chunkCount === 0) {
        addBanner('知识库尚无索引，请点击重建索引。', '重建索引', doRebuild);
      }
    }

    function canonicalProblemText(segments) {
      return (Array.isArray(segments) ? segments : [])
        .map((s) => `${String(s?.segmentType ?? '').trim()}::${String(s?.text ?? '').replace(/\s+/g, ' ').trim()}`)
        .join('\n');
    }

    function isSegmentsFavorited(segments) {
      const key = canonicalProblemText(segments);
      if (!key) return false;
      return (favoritesState.items || []).some((it) => canonicalProblemText(it.segments) === key);
    }

    function formatTimeLabel(ts) {
      const n = Number(ts || 0);
      if (!n) return '';
      try {
        const d = new Date(n);
        const mm = String(d.getMonth() + 1).padStart(2, '0');
        const dd = String(d.getDate()).padStart(2, '0');
        const hh = String(d.getHours()).padStart(2, '0');
        const mi = String(d.getMinutes()).padStart(2, '0');
        return `${mm}-${dd} ${hh}:${mi}`;
      } catch {
        return '';
      }
    }

    function updateLibraryBadges() {
      const hLen = (historyState.items || []).length;
      const fLen = (favoritesState.items || []).length;
      if (historyCountBadge) historyCountBadge.textContent = hLen > 0 ? `(${hLen})` : '';
      if (favCountBadge) favCountBadge.textContent = fLen > 0 ? `(${fLen})` : '';
    }

    async function refreshLibrary() {
      try {
        const [h, f] = await Promise.all([
          apiCall('/api/history', null, 'GET'),
          apiCall('/api/favorites', null, 'GET'),
        ]);
        if (h) historyState = h;
        if (f) favoritesState = f;
        updateLibraryBadges();
        if (historyState.limit != null) {
          cfgHistoryLimit.value = String(historyState.limit);
          libHistoryLimitInput.value = String(historyState.limit);
        }
        if (currentSegments.length > 0) renderSegments(currentSegments);
        if (libraryModal.classList.contains('open')) renderLibraryModal();
      } catch {
        // Ignore transient library refresh error
      }
    }

    async function toggleFavoriteGroup(grp) {
      if (!grp || !Array.isArray(grp.items) || grp.items.length === 0) return;
      showActionError('');
      try {
        const res = await apiCall('/api/favorites/toggle', {
          groupId: grp.id,
          title: grp.title || '',
          source: grp.source || 'user',
          segments: grp.items,
        });
        favoritesState = { items: res.items || [] };
        updateLibraryBadges();
        if (currentSegments.length > 0) renderSegments(currentSegments);
        if (libraryModal.classList.contains('open')) renderLibraryModal();
        showImportStatus(res.favorited ? '★ 已收藏该题目！' : '已取消收藏该题目。', 'info', 2500);
      } catch (e) {
        showActionError('收藏操作失败：' + e.message);
      }
    }

    async function restoreFromLibrary(kind, id, mode) {
      showActionError('');
      try {
        const res = await apiCall('/api/library/restore', { kind, id, mode });
        lastCardsUpdatedAt = res.updatedAt || Date.now();
        renderSegments(res.segments, {
          scrollToGroupId: res.mode === 'append' ? res.lastAddedGroupId : '',
        });
        libraryModal.classList.remove('open');
        showImportStatus(mode === 'append' ? '✅ 已将题目追加到当前面板！' : '✅ 已载入选中题目！', 'info', 3000);
      } catch (e) {
        showActionError('载入题目失败：' + e.message);
      }
    }

    async function applyHistoryLimit(rawVal) {
      const n = Math.min(50, Math.max(1, Math.round(Number(rawVal) || 3)));
      try {
        const res = await apiCall('/api/settings', { historyLimit: n });
        const savedLimit = res.settings?.historyLimit ?? n;
        cfgHistoryLimit.value = String(savedLimit);
        libHistoryLimitInput.value = String(savedLimit);
        await refreshLibrary();
        showImportStatus(`✅ 历史记录上限已设为最近 ${savedLimit} 次。`, 'info', 2500);
      } catch (e) {
        showActionError('保存历史保存条数失败：' + e.message);
      }
    }

    function renderLibraryModal() {
      const isHist = activeLibraryTab === 'history';
      libTabHistory.classList.toggle('active', isHist);
      libTabFavorites.classList.toggle('active', !isHist);
      libLimitControl.style.display = isHist ? 'flex' : 'none';
      clearHistoryBtn.style.display = isHist ? '' : 'none';

      const items = isHist ? (historyState.items || []) : (favoritesState.items || []);
      const limit = historyState.limit ?? 3;
      librarySub.textContent = isHist
        ? `自动保存最近 ${limit} 次拆解或导入的题目（当前 ${items.length}/${limit} 条）`
        : `已收藏 ${items.length} 道题目，可随时载入或取消收藏`;

      libraryList.innerHTML = '';
      if (items.length === 0) {
        libraryList.innerHTML = `<div class="empty">${isHist ? '暂无历史题目记录' : '暂无收藏题目，可点击题目标题栏的「☆ 收藏」按钮添加'}</div>`;
        return;
      }

      for (const item of items) {
        const row = document.createElement('div');
        row.className = 'chat-item';

        const top = document.createElement('div');
        top.className = 'chat-item-top';
        const leftMeta = document.createElement('div');
        leftMeta.style.display = 'flex';
        leftMeta.style.alignItems = 'center';
        leftMeta.style.gap = '6px';

        const badge = document.createElement('span');
        badge.className = item.source === 'local' ? 'chat-role' : 'chat-role ai';
        badge.textContent = item.source === 'local' ? '本地拆解' : 'Antigravity';
        const titleEl = document.createElement('strong');
        titleEl.style.color = 'var(--kj-text)';
        titleEl.textContent = item.title || '未命名题目';
        leftMeta.appendChild(badge);
        leftMeta.appendChild(titleEl);

        const rightMeta = document.createElement('span');
        const tsLabel = formatTimeLabel(isHist ? item.updatedAt : item.favoritedAt);
        const segCount = Array.isArray(item.segments) ? item.segments.length : 0;
        rightMeta.textContent = `${segCount} 张卡片${tsLabel ? ' · ' + tsLabel : ''}`;

        top.appendChild(leftMeta);
        top.appendChild(rightMeta);

        const prev = document.createElement('div');
        prev.className = 'chat-preview';
        const firstText = String(item.segments?.[0]?.text || '').replace(/\s+/g, ' ').trim();
        prev.textContent = firstText.length > 140 ? `${firstText.slice(0, 140)}…` : firstText;

        const acts = document.createElement('div');
        acts.className = 'chat-item-actions';

        const loadReplaceBtn = document.createElement('button');
        loadReplaceBtn.className = 'primary';
        loadReplaceBtn.textContent = '载入本题';
        loadReplaceBtn.onclick = () => restoreFromLibrary(isHist ? 'history' : 'favorite', item.id || item.problemKey, 'replace');
        acts.appendChild(loadReplaceBtn);

        const loadAppendBtn = document.createElement('button');
        loadAppendBtn.textContent = '追加到当前';
        loadAppendBtn.onclick = () => restoreFromLibrary(isHist ? 'history' : 'favorite', item.id || item.problemKey, 'append');
        acts.appendChild(loadAppendBtn);

        if (isHist) {
          const favd = isSegmentsFavorited(item.segments);
          const favBtn = document.createElement('button');
          favBtn.className = favd ? 'fav-star-btn active' : 'fav-star-btn';
          favBtn.textContent = favd ? '★ 已收藏' : '☆ 收藏';
          favBtn.onclick = () => toggleFavoriteGroup({
            id: item.id,
            title: item.title,
            source: item.source,
            items: item.segments,
          });
          acts.appendChild(favBtn);

          const delBtn = document.createElement('button');
          delBtn.className = 'danger';
          delBtn.textContent = '删除';
          delBtn.onclick = async () => {
            const res = await apiCall('/api/history/remove', { id: item.id || item.problemKey });
            historyState = res;
            updateLibraryBadges();
            renderLibraryModal();
          };
          acts.appendChild(delBtn);
        } else {
          const unfavBtn = document.createElement('button');
          unfavBtn.className = 'danger';
          unfavBtn.textContent = '取消收藏';
          unfavBtn.onclick = async () => {
            const res = await apiCall('/api/favorites/remove', { id: item.problemKey || item.id });
            favoritesState = res;
            updateLibraryBadges();
            if (currentSegments.length > 0) renderSegments(currentSegments);
            renderLibraryModal();
          };
          acts.appendChild(unfavBtn);
        }

        row.appendChild(top);
        row.appendChild(prev);
        row.appendChild(acts);
        libraryList.appendChild(row);
      }
    }

    function openLibraryModal(tab) {
      activeLibraryTab = tab === 'favorite' ? 'favorite' : 'history';
      libraryModal.classList.add('open');
      renderLibraryModal();
      refreshLibrary();
    }

    function addBanner(text, btnText, onClick) {
      const div = document.createElement('div');
      div.className = 'banner';
      div.innerHTML = '<span>' + escapeHtml(text) + '</span>';
      if (btnText) {
        const b = document.createElement('button');
        b.textContent = btnText;
        b.onclick = onClick;
        div.appendChild(b);
      }
      bannersEl.appendChild(div);
    }

    async function loadState() {
      const state = await apiCall('/api/state', null, 'GET');
      updateStatusUI(state);
      if (state.latestCards && state.latestCards.updatedAt > lastCardsUpdatedAt) {
        lastCardsUpdatedAt = state.latestCards.updatedAt;
        renderSegments(state.latestCards.segments);
      }
    }

    async function doRebuild() {
      rebuildBtn.disabled = true;
      rebuildBtn.textContent = '索引中...';
      try {
        await apiCall('/api/rebuild', {});
        loadedDocKey = null;
        loadedDoc = null;
        docWindow = { start: 0, end: -1, startPage: 0, endPage: -1 };
        await loadState();
      } catch (e) {
        alert('重建索引失败: ' + e.message);
      } finally {
        rebuildBtn.disabled = false;
        rebuildBtn.textContent = '重建索引';
      }

      clearCardsBtn.disabled = true;
      showActionError('');
      try {
        const res = await apiCall('/api/cards/clear', {});
        lastCardsUpdatedAt = res.updatedAt || Date.now();
        renderSegments([]);
      } catch (e) {
        showActionError('清空旧题失败：' + e.message);
      } finally {
        clearCardsBtn.disabled = false;
