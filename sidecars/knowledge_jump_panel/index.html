    historyBtn.onclick = () => openLibraryModal('history');
    favoritesBtn.onclick = () => openLibraryModal('favorite');
    libTabHistory.onclick = () => { activeLibraryTab = 'history'; renderLibraryModal(); };
    libTabFavorites.onclick = () => { activeLibraryTab = 'favorite'; renderLibraryModal(); };
    libSaveLimitBtn.onclick = () => applyHistoryLimit(libHistoryLimitInput.value);
    closeLibraryBtn.onclick = () => libraryModal.classList.remove('open');
    clearHistoryBtn.onclick = async () => {
      const res = await apiCall('/api/history/clear', {});
      historyState = res;
      updateLibraryBadges();
      renderLibraryModal();
    };
    settingsBtn.onclick = () => settingsModal.classList.add('open');
    document.getElementById('closeModalBtn').onclick = () => settingsModal.classList.remove('open');
    document.getElementById('saveModalBtn').onclick = async () => {
      const nextDir = cfgKbDir.value.trim();
      const nextLimit = Math.min(50, Math.max(1, Math.round(Number(cfgHistoryLimit.value) || 3)));
      const dirChanged = nextDir && nextDir !== currentKnowledgeDir;
      await apiCall('/api/settings', {
        knowledgeDir: nextDir,
        importMode,
        historyLimit: nextLimit,
      });
      settingsModal.classList.remove('open');
      if (dirChanged) {
        await doRebuild();
      } else {
        await loadState();
      }
    };

    analyzeBtn.onclick = async () => {
      const text = questionText.value.trim();
      if (!text) {
        showActionError('请输入题干文字，或直接在 Antigravity 对话框粘贴截图。');
        return;
      }
      showActionError('');
      analyzeBtn.disabled = true;
      try {
        const res = await apiCall('/api/analyze', { text, mode: importMode });
        lastCardsUpdatedAt = res.updatedAt || Date.now();
        renderSegments(res.segments, {
          scrollToGroupId: res.mode === 'append' ? res.lastAddedGroupId : '',
        });
        refreshLibrary();
      } catch (e) {
        showActionError(e.message);
      } finally {
        analyzeBtn.disabled = false;
      }
    };

    async function removeGroup(groupId) {
      showActionError('');
      try {
        const res = await apiCall('/api/cards/remove-group', { groupId });
        lastCardsUpdatedAt = res.updatedAt || Date.now();
        renderSegments(res.segments);
      } catch (e) {
        showActionError('移除题目失败：' + e.message);
      }
    }

    function groupSegments(segments) {
      const groups = [];
      const byId = new Map();
      for (const seg of segments) {
        const gid = seg.groupId || 'legacy';
        let grp = byId.get(gid);
        if (!grp) {
          grp = { id: gid, title: seg.groupTitle || '', items: [] };
          byId.set(gid, grp);
          groups.push(grp);
        }
        if (!grp.title && seg.groupTitle) grp.title = seg.groupTitle;
        grp.items.push(seg);
      }
      return groups;
    }

    function renderSegments(segments, opts = {}) {
      currentSegments = Array.isArray(segments) ? segments : [];
      if (!currentSegments.length) {
        cardsToolbar.style.display = 'none';
        resultsEl.innerHTML = '<div class="empty">等待输入文字题干，或在 Antigravity 对话框发送题目截图...</div>';
        return;
      }

      const groups = groupSegments(currentSegments);
      cardsSummary.textContent = '共 ' + groups.length + ' 道题 · ' + currentSegments.length + ' 张卡片';
      cardsToolbar.style.display = 'flex';
      resultsEl.innerHTML = '';

      let scrollHeaderEl = null;
      groups.forEach((grp, gIdx) => {
        const hdr = document.createElement('div');
        hdr.className = 'problem-group-header';
        hdr.dataset.groupId = grp.id;
        const meta = document.createElement('div');
        meta.className = 'problem-group-meta';
        const titleSpan = document.createElement('span');
        titleSpan.className = 'problem-group-title';
        titleSpan.textContent = grp.title ? ('题目 ' + (gIdx + 1) + ' · ' + grp.title) : ('题目 ' + (gIdx + 1));
        const countSpan = document.createElement('span');
        countSpan.textContent = '(' + grp.items.length + ' 张卡片)';
        meta.appendChild(titleSpan);
        meta.appendChild(countSpan);

        const acts = document.createElement('div');
        acts.className = 'problem-group-actions';

        const favd = isSegmentsFavorited(grp.items);
        const favBtn = document.createElement('button');
        favBtn.type = 'button';
        favBtn.className = favd ? 'problem-group-fav active' : 'problem-group-fav';
        favBtn.textContent = favd ? '★ 已收藏' : '☆ 收藏';
        favBtn.title = favd ? '点击取消收藏本题' : '收藏本题到收藏夹';
        favBtn.onclick = () => toggleFavoriteGroup(grp);

        const rmBtn = document.createElement('button');
        rmBtn.type = 'button';
        rmBtn.className = 'problem-group-remove';
        rmBtn.textContent = '移除本题';
        rmBtn.onclick = () => removeGroup(grp.id);

        acts.appendChild(favBtn);
        acts.appendChild(rmBtn);
        hdr.appendChild(meta);
        hdr.appendChild(acts);
        resultsEl.appendChild(hdr);

        if (opts.scrollToGroupId && grp.id === opts.scrollToGroupId) {
          scrollHeaderEl = hdr;
        }

        for (const seg of grp.items) {
          const hasMatch = Boolean(seg.matchedChunkId && seg.matchedChunk);
          const card = document.createElement('div');
          card.className = hasMatch ? 'card clickable' : 'card';
          const mc = seg.matchedChunk;
          const warnNote = mc && mc.isOverdue ? ' ⚠️ [超过复核期 ' + escapeHtml(mc.reviewAfterStr) + ']' : '';
          const footHtml = hasMatch
            ? '<div class="card-foot">📌 关联知识点：' + escapeHtml(mc.relativePath) + ' (' + (mc.type === 'markdown' || mc.type === 'docx' ? ('第 ' + ((mc.startLine || 0) + 1) + ' 行') : ('第 ' + (mc.pageNumber || 1) + ' 页')) + ')' + warnNote + '</div>'
            : '<div class="card-foot muted">未匹配到知识库切片' + (seg.knowledgeTag ? ' · ' + escapeHtml(seg.knowledgeTag) : '') + '</div>';

          card.innerHTML =
            '<div class="card-top"><span class="seg-tag">' + escapeHtml(seg.segmentType || '题目片段') + '</span>' +
            '<span style="font-size:11px;color:var(--kj-muted);">' + escapeHtml(seg.knowledgeTag || '') + '</span></div>' +
            '<div class="card-body">' + renderSimpleMd(seg.text || '') + '</div>' +
            footHtml;

          if (hasMatch) card.onclick = () => jumpToChunk(seg.matchedChunkId, mc);
          resultsEl.appendChild(card);
        }
      });

      renderMathNow(resultsEl);
      if (scrollHeaderEl) {
        requestAnimationFrame(() => scrollHeaderEl.scrollIntoView({ behavior: 'smooth', block: 'start' }));
      }
    }

    function applyHighlightAndScroll(docType, startLine, endLine, targetPage) {
      if (hlTimer) { clearTimeout(hlTimer); hlTimer = null; }
      docContent.querySelectorAll('.hl-amber').forEach((el) => el.classList.remove('hl-amber'));

      let scrollTarget = null;
      if (docType === 'markdown') {
        const eagerStart = Math.max(0, startLine - 25);
        const eagerEnd = endLine + 25;
        for (const blk of docBlocks) {
          if (blk.end >= startLine && blk.start <= endLine) {
            blk.el.classList.add('hl-amber');
            if (!scrollTarget) scrollTarget = blk.el;
          }
          if (blk.end >= eagerStart && blk.start <= eagerEnd && blk.el.dataset.mathPending === '1') {
            renderMathNow(blk.el);
          }
        }
      } else {
        const pageEl = pdfPageMap.get(targetPage);
        if (pageEl) {
          pageEl.classList.add('hl-amber');
          scrollTarget = pageEl;
          if (pageEl.dataset.mathPending === '1') renderMathNow(pageEl);
        }
      }

      if (scrollTarget) {
        requestAnimationFrame(() => {
          const paneRect = docPane.getBoundingClientRect();
          const targetRect = scrollTarget.getBoundingClientRect();
          const nextTop = Math.max(0, docPane.scrollTop + (targetRect.top - paneRect.top) - 110);
          docPane.scrollTo({ top: nextTop, behavior: 'smooth' });
        });
      }

      hlTimer = setTimeout(() => {
        docContent.querySelectorAll('.hl-amber').forEach((el) => el.classList.remove('hl-amber'));
      }, 3500);
    }

    function adjustMarkdownRange(lines, rawStart, rawEnd) {
      const total = lines.length;
      if (total === 0) return [0, -1];
      let s = Math.max(0, Math.min(total - 1, rawStart));
      let e = Math.max(s, Math.min(total - 1, rawEnd));

      const isTableRow = (line) => /^\s*\|.*\|\s*$/.test(line);
      while (s > 0 && isTableRow(lines[s]) && isTableRow(lines[s - 1])) s--;
      while (e < total - 1 && isTableRow(lines[e]) && isTableRow(lines[e + 1])) e++;

      let ddParity = 0;
      for (let i = 0; i < s; i++) {
        ddParity ^= ((lines[i].match(/\$\$/g) || []).length & 1);
      }
      if (ddParity === 1) {
        while (s > 0) {
          s--;
          const cnt = (lines[s].match(/\$\$/g) || []).length;
          if ((cnt & 1) === 1) break;
        }
      }

      let endParity = 0;
      for (let i = s; i <= e; i++) {
        endParity ^= ((lines[i].match(/\$\$/g) || []).length & 1);
      }
      if (endParity === 1) {
        while (e < total - 1) {
          e++;
          const cnt = (lines[e].match(/\$\$/g) || []).length;
          if ((cnt & 1) === 1) break;
        }
      }
      return [s, e];
    }

    function makeWindowBar(infoText, buttons) {
      const bar = document.createElement('div');
      bar.className = 'doc-window-bar';
      const info = document.createElement('span');
      info.textContent = infoText;
      const acts = document.createElement('div');
      acts.className = 'win-actions';
      for (const spec of buttons) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.textContent = spec.label;
        btn.onclick = spec.onClick;
        acts.appendChild(btn);
      }
      bar.appendChild(info);
      bar.appendChild(acts);
      return bar;
    }

    function renderDocWindow(doc, rangeStart, rangeEnd, opts = {}) {
      const prevScrollHeight = opts.preserveScroll ? docPane.scrollHeight : 0;
      const prevScrollTop = opts.preserveScroll ? docPane.scrollTop : 0;

      resetMathObserver();
      docBlocks = [];
      pdfPageMap = new Map();
      const frag = document.createDocumentFragment();
      const lazyMathEls = [];

      if (doc.type === 'markdown') {
        const total = doc.lines.length;
        const [s, e] = total <= DOC_WINDOW_THRESHOLD
          ? [0, total - 1]
          : adjustMarkdownRange(doc.lines, rangeStart, rangeEnd);

        if (s > 0) {
          frag.appendChild(makeWindowBar(
            `上方已折叠第 1–${s} 行（当前显示第 ${s + 1}–${e + 1} / 共 ${total} 行）`,
            [
              {
                label: `向上展开 ${DOC_WIN_STEP} 行`,
                onClick: () => renderDocWindow(doc, Math.max(0, s - DOC_WIN_STEP), e, { preserveScroll: true, expandDirection: 'up' }),
              },
              {
                label: '展开全文',
                onClick: () => renderDocWindow(doc, 0, total - 1, { preserveScroll: true, expandDirection: 'up' }),
              },
            ]
          ));
        }

        let idx = s;
        while (idx <= e) {
          const line = doc.lines[idx];
          if (/^\s*\|.*\|\s*$/.test(line)) {
            const table = document.createElement('table');
            table.className = 'md-table';
            let isFirstRow = true;
            let tbody = null;
            while (idx <= e && /^\s*\|.*\|\s*$/.test(doc.lines[idx])) {
              const rowLine = doc.lines[idx];
              const rawCells = rowLine.trim().slice(1, -1).split('|').map((c) => c.trim());
              const isSep = rawCells.every((c) => /^:?-{2,}:?$/.test(c));
              if (!isSep) {
                const tr = document.createElement('tr');
                if (hasMathSyntax(rowLine)) {
                  tr.dataset.mathPending = '1';
                  lazyMathEls.push(tr);
                }
                if (isFirstRow) {
                  const thead = document.createElement('thead');
                  for (const cellText of rawCells) {
                    const th = document.createElement('th');
                    th.innerHTML = formatInlineMd(cellText);
                    tr.appendChild(th);
                  }
                  thead.appendChild(tr);
                  table.appendChild(thead);
                  isFirstRow = false;
                } else {
                  if (!tbody) {
                    tbody = document.createElement('tbody');
                    table.appendChild(tbody);
                  }
                  for (const cellText of rawCells) {
                    const td = document.createElement('td');
                    td.innerHTML = formatInlineMd(cellText);
                    tr.appendChild(td);
                  }
                  tbody.appendChild(tr);
                }
                docBlocks.push({ start: idx, end: idx, el: tr });
              }
              idx++;
            }
            frag.appendChild(table);
            continue;
          }

          const div = document.createElement('div');
          const trimmed = line.trim();
          const ddCount = (trimmed.match(/\$\$/g) || []).length;
          if (ddCount % 2 === 1) {
            const blockStart = idx;
            const blockLines = [line];
            idx++;
            while (idx <= e) {
              const nextLine = doc.lines[idx];
              blockLines.push(nextLine);
              const nextDd = (nextLine.match(/\$\$/g) || []).length;
              idx++;
              if (nextDd % 2 === 1) break;
            }
            const joined = blockLines.join('\n');
            div.className = 'doc-line';
            div.innerHTML = formatInlineMd(joined);
            div.dataset.mathPending = '1';
            lazyMathEls.push(div);
            docBlocks.push({ start: blockStart, end: idx - 1, el: div });
            frag.appendChild(div);
            continue;
          }

          const hMatch = trimmed.match(/^(#{1,4})\s+(.+)$/);
          if (hMatch) {
            const lvl = hMatch[1].length;
            div.className = 'doc-line';
            div.innerHTML = `<h${lvl}>${formatInlineMd(hMatch[2])}</h${lvl}>`;
          } else if (/^>\s*/.test(trimmed)) {
            div.className = 'doc-line';
            div.innerHTML = `<blockquote>${formatInlineMd(trimmed.replace(/^>\s*/, ''))}</blockquote>`;
          } else if (/^[-*]\s+/.test(trimmed)) {
            div.className = 'doc-line list-item';
            div.innerHTML = formatInlineMd(trimmed.replace(/^[-*]\s+/, ''));
          } else if (/^---+$/.test(trimmed)) {
            div.className = 'doc-line';
            div.innerHTML = '<hr style="border:none;border-top:1px solid var(--kj-border);margin:6px 0;" />';
          } else {
            div.className = 'doc-line';
            div.innerHTML = formatInlineMd(line);
          }

          if (hasMathSyntax(line)) {
            div.dataset.mathPending = '1';
            lazyMathEls.push(div);
          }
          docBlocks.push({ start: idx, end: idx, el: div });
          frag.appendChild(div);
          idx++;
        }

        if (e < total - 1) {
          frag.appendChild(makeWindowBar(
            `下方还有第 ${e + 2}–${total} 行未展开`,
            [
              {
                label: `向下展开 ${DOC_WIN_STEP} 行`,
                onClick: () => renderDocWindow(doc, s, Math.min(total - 1, e + DOC_WIN_STEP), { preserveScroll: true, expandDirection: 'down' }),
              },
              {
                label: '展开全文',
                onClick: () => renderDocWindow(doc, 0, total - 1, { preserveScroll: true, expandDirection: 'down' }),
              },
            ]
          ));
        }

        docWindow = { start: s, end: e, startPage: 0, endPage: -1 };
      } else {
        const total = doc.pages.length;
        const s = total <= PDF_WINDOW_THRESHOLD ? 0 : Math.max(0, rangeStart);
        const e = total <= PDF_WINDOW_THRESHOLD ? total - 1 : Math.min(total - 1, rangeEnd);

        if (s > 0) {
          frag.appendChild(makeWindowBar(
            `上方已折叠前 ${s} 页（当前显示第 ${doc.pages[s].pageNumber}–${doc.pages[e].pageNumber} 页 / 共 ${total} 页）`,
            [
              {
                label: `向上展开 ${PDF_WIN_STEP} 页`,
                onClick: () => renderDocWindow(doc, Math.max(0, s - PDF_WIN_STEP), e, { preserveScroll: true, expandDirection: 'up' }),
              },
              {
                label: '展开全部页',
                onClick: () => renderDocWindow(doc, 0, total - 1, { preserveScroll: true, expandDirection: 'up' }),
              },
            ]
          ));
        }

        for (let i = s; i <= e; i++) {
          const p = doc.pages[i];
          const box = document.createElement('div');
          box.className = 'pdf-page';
          box.innerHTML = '<div style="font-weight:600;margin-bottom:4px;">第 ' + p.pageNumber + ' 页</div><div>' + escapeHtml(p.text) + '</div>';
          if (hasMathSyntax(p.text)) {
            box.dataset.mathPending = '1';
            lazyMathEls.push(box);
          }
          pdfPageMap.set(p.pageNumber, box);
          frag.appendChild(box);
        }

        if (e < total - 1) {
          frag.appendChild(makeWindowBar(
            `下方还有 ${total - 1 - e} 页未展开`,
            [
              {
                label: `向下展开 ${PDF_WIN_STEP} 页`,
                onClick: () => renderDocWindow(doc, s, Math.min(total - 1, e + PDF_WIN_STEP), { preserveScroll: true, expandDirection: 'down' }),
              },
              {
                label: '展开全部页',
                onClick: () => renderDocWindow(doc, 0, total - 1, { preserveScroll: true, expandDirection: 'down' }),
              },
            ]
          ));
        }

        docWindow = {
          start: s,
          end: e,
          startPage: doc.pages[s]?.pageNumber ?? 1,
          endPage: doc.pages[e]?.pageNumber ?? 1,
        };
      }

      docContent.innerHTML = '';
      docContent.appendChild(frag);
      loadedDocKey = doc.key;

      if (opts.preserveScroll && opts.expandDirection === 'up') {
        const delta = docPane.scrollHeight - prevScrollHeight;
        docPane.scrollTop = prevScrollTop + Math.max(0, delta);
      }

      if (opts.highlightStart != null || opts.targetPage != null) {
        applyHighlightAndScroll(
          doc.type,
          opts.highlightStart ?? 0,
          opts.highlightEnd ?? opts.highlightStart ?? 0,
          opts.targetPage ?? 1
        );
      }

      if (lazyMathEls.length > 0 && 'IntersectionObserver' in window) {
        mathObserver = new IntersectionObserver(
          (entries) => {
            for (const entry of entries) {
              if (entry.isIntersecting) {
                mathObserver.unobserve(entry.target);
                enqueueLazyMath(entry.target);
              }
            }
          },
          { root: docPane, rootMargin: '120px 0px' }
        );
        for (const el of lazyMathEls) {
          if (el.dataset.mathPending === '1') mathObserver.observe(el);
        }
      } else {
        for (const el of lazyMathEls) enqueueLazyMath(el);
      }
    }

    function openTargetInDoc(doc, startLine, endLine, targetPage) {
      if (doc.type === 'markdown') {
        const inWin = doc.lines.length <= DOC_WINDOW_THRESHOLD ||
          (startLine >= docWindow.start && endLine <= docWindow.end);
        if (loadedDocKey === doc.key && inWin) {
          applyHighlightAndScroll('markdown', startLine, endLine, targetPage);
          return;
        }
        renderDocWindow(doc, startLine - DOC_WIN_BEFORE, endLine + DOC_WIN_AFTER, {
          highlightStart: startLine,
          highlightEnd: endLine,
        });
      } else {
        const targetIdx = Math.max(0, doc.pages.findIndex((p) => p.pageNumber === targetPage));
        const inWin = doc.pages.length <= PDF_WINDOW_THRESHOLD ||
          (targetPage >= docWindow.startPage && targetPage <= docWindow.endPage);
        if (loadedDocKey === doc.key && inWin) {
          applyHighlightAndScroll('pdf', startLine, endLine, targetPage);
          return;
        }
        renderDocWindow(doc, targetIdx - PDF_WIN_BEFORE, targetIdx + PDF_WIN_AFTER, {
          targetPage,
        });
      }
    }

    async function jumpToChunk(chunkId, matchedChunk = null) {
      if (hlTimer) { clearTimeout(hlTimer); hlTimer = null; }
      try {
        // Fast path: same document cached in memory -> zero network!
        if (matchedChunk && loadedDoc) {
          const expectedType = (matchedChunk.type === 'markdown' || matchedChunk.type === 'docx') ? 'markdown' : 'pdf';
          const expectedKey = expectedType + ':' + matchedChunk.relativePath;
          if (loadedDoc.key === expectedKey) {
            docHeader.textContent = matchedChunk.relativePath + ' — ' + (matchedChunk.headingTitle || '');
            openTargetInDoc(
              loadedDoc,
              matchedChunk.startLine ?? 0,
              matchedChunk.endLine ?? matchedChunk.startLine ?? 0,
              matchedChunk.pageNumber ?? 1
            );
            return;
          }
        }

        const rawDoc = await apiCall('/api/document', { chunkId });
        const docKey = rawDoc.type + ':' + rawDoc.relativePath;
        docHeader.textContent = rawDoc.relativePath + ' — ' + rawDoc.headingTitle;

        if (loadedDoc && loadedDoc.key === docKey) {
          openTargetInDoc(
            loadedDoc,
            rawDoc.startLine ?? 0,
            rawDoc.endLine ?? rawDoc.startLine ?? 0,
            rawDoc.targetPage ?? 1
          );
          return;
        }

        loadedDoc = {
          key: docKey,
          type: rawDoc.type,
          relativePath: rawDoc.relativePath,
          headingTitle: rawDoc.headingTitle,
          lines: Array.isArray(rawDoc.lines) ? rawDoc.lines : [],
          pages: Array.isArray(rawDoc.pages) ? rawDoc.pages : [],
        };
        openTargetInDoc(
          loadedDoc,
          rawDoc.startLine ?? 0,
          rawDoc.endLine ?? rawDoc.startLine ?? 0,
          rawDoc.targetPage ?? 1
        );
      } catch (e) {
        loadedDocKey = null;
        loadedDoc = null;
        docContent.innerHTML = '<div class="banner error">' + escapeHtml(e.message) + '</div>';
      }
    }

    // Visibility-aware incremental poll for cards pushed by Antigravity MCP
    async function pollCards() {
      if (document.hidden || isPollingCards) return;
      isPollingCards = true;
      try {
        const data = await apiCall('/api/cards?since=' + encodeURIComponent(lastCardsUpdatedAt), null, 'GET');
        if (data && !data.unchanged && data.updatedAt > lastCardsUpdatedAt) {
          lastCardsUpdatedAt = data.updatedAt;
          renderSegments(data.segments, {
            scrollToGroupId: data.mode === 'append' ? data.lastAddedGroupId : '',
          });
          refreshLibrary();
          if (awaitingChatImport) {
            awaitingChatImport = false;
            showImportStatus('✅ 已成功导入对话中的题目！', 'info', 4000);
          }
        }
      } catch {
        // Ignore transient poll errors
      } finally {
        isPollingCards = false;
      }
    }

    setInterval(pollCards, 2000);
    document.addEventListener('visibilitychange', () => {
      if (!document.hidden) pollCards();
    });

    loadState().catch((e) => {
      bannersEl.innerHTML = '<div class="banner error">初始化失败: ' + escapeHtml(e.message) + '</div>';
    });
  </script>
</body>
</html>
